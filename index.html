<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cardápio Virtual Interativo</title>

  <!-- Google Fonts: Poppins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       1. VARIÁVEIS E RESET CSS
       ========================================================================== */
    :root {
      --primary: #C62828;
      --primary-hover: #B71C1C;
      --bg-light: #F8F9FA;
      --surface: #FFFFFF;
      --text-main: #2B2D42;
      --text-muted: #6C757D;
      --border: #E9ECEF;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.1);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-family: 'Poppins', sans-serif;
    }

    [data-theme="dark"] {
      --bg-light: #121212;
      --surface: #1E1E1E;
      --text-main: #F8F9FA;
      --text-muted: #ADB5BD;
      --border: #2D3748;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 16px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-light);
      color: var(--text-main);
      padding-bottom: 90px;
      transition: background-color 0.3s, color 0.3s;
    }

    /* ==========================================================================
       2. CABEÇALHO / HERO SECTION
       ========================================================================== */
    .hero-container {
      position: relative;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .hero-banner {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #E2E8F0;
    }

    .top-bar-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .lang-select-container select, .btn-header-action {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.85rem;
      font-weight: 500;
      color: #2B2D42;
      cursor: pointer;
      backdrop-filter: blur(4px);
      box-shadow: var(--shadow-sm);
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .establishment-info {
      text-align: center;
      padding: 0 16px 20px 16px;
      margin-top: -45px;
      position: relative;
      z-index: 5;
    }

    .logo-badge {
      width: 80px;
      height: 80px;
      background: var(--surface);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      box-shadow: var(--shadow-md);
      border: 3px solid var(--surface);
      margin-bottom: 8px;
    }

    .establishment-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .establishment-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .establishment-meta {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 10px;
      font-size: 0.8rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ==========================================================================
       3. BARRA DE PESQUISA E CATEGORIAS
       ========================================================================== */
    .sticky-controls {
      position: sticky;
      top: 0;
      background: var(--surface);
      z-index: 100;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .search-box {
      position: relative;
      margin-bottom: 10px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 40px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border);
      background: var(--bg-light);
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .categories-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      padding-bottom: 2px;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .category-chip {
      padding: 6px 16px;
      border-radius: var(--radius-full);
      background: var(--bg-light);
      border: 1px solid var(--border);
      color: var(--text-main);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .category-chip.active {
      background: var(--primary);
      color: #FFFFFF;
      border-color: var(--primary);
    }

    /* ==========================================================================
       4. LISTAGEM DE PRODUTOS
       ========================================================================== */
    .menu-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px;
    }

    .category-section {
      margin-bottom: 28px;
    }

    .category-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .category-divider {
      height: 2px;
      background: var(--primary);
      width: 100%;
      margin-bottom: 12px;
      border-radius: 2px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 600px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .product-card {
      background: var(--surface);
      border-radius: var(--radius-md);
      padding: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border);
      position: relative;
    }

    .product-card.unavailable {
      opacity: 0.55;
    }

    .product-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      line-height: 1.3;
      margin-bottom: 6px;
    }

    .product-allergy {
      font-size: 0.7rem;
      color: #D97706;
      font-weight: 500;
      margin-bottom: 8px;
    }

    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .product-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
    }

    .btn-add-cart {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 6px 12px;
      border-radius: var(--radius-full);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add-cart:disabled {
      background: var(--text-muted);
      cursor: not-allowed;
    }

    /* ==========================================================================
       5. CARRINHO / BARRA INFERIOR FIXA
       ========================================================================== */
    .cart-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 -4px 16px rgba(0,0,0,0.1);
      z-index: 150;
    }

    .cart-summary {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-badge-container {
      position: relative;
      font-size: 1.5rem;
    }

    .cart-badge {
      position: absolute;
      top: -4px;
      right: -8px;
      background: var(--primary);
      color: #FFFFFF;
      font-size: 0.7rem;
      font-weight: 700;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cart-total-text {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .cart-total-value {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .btn-view-cart {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 10px 20px;
      border-radius: var(--radius-full);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ==========================================================================
       6. MODAIS E DRAWER
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 200;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--surface);
      width: 100%;
      max-width: 600px;
      border-top-left-radius: var(--radius-lg);
      border-top-right-radius: var(--radius-lg);
      padding: 20px;
      max-height: 85vh;
      overflow-y: auto;
      animation: slideUp 0.3s ease;
    }

    .modal-fullscreen {
      height: 100vh;
      max-height: 100vh;
      border-radius: 0;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-qty {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-light);
      color: var(--text-main);
      font-weight: 700;
      cursor: pointer;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .form-group input, .form-group select, .form-group textarea {
      width: 100%;
      padding: 10px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg-light);
      color: var(--text-main);
      font-size: 0.9rem;
    }

    .tabs-header {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .tab-btn {
      padding: 8px 12px;
      background: none;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
    }

    .tab-btn.active {
      color: var(--primary);
      border-color: var(--primary);
    }

    .btn-primary {
      background: var(--primary);
      color: #FFFFFF;
      border: none;
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }

    .btn-secondary {
      background: var(--bg-light);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
    }

    .floating-gear {
      position: fixed;
      bottom: 80px;
      right: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      z-index: 90;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- ==========================================================================
     HERO SECTION
     ========================================================================== -->
  <div class="hero-container">
    <div class="top-bar-overlay">
      <div class="lang-select-container">
        <select id="langSelector" onchange="changeLanguage(this.value)">
          <option value="PT">🇧🇷 PT</option>
          <option value="EN">🇺🇸 EN</option>
          <option value="ZH">🇨🇳 ZH</option>
          <option value="FR">🇫🇷 FR</option>
          <option value="IT">🇮🇹 IT</option>
          <option value="DE">🇩🇪 DE</option>
          <option value="KO">🇰🇷 KO</option>
          <option value="ES">🇪🇸 ES</option>
          <option value="JA">🇯🇵 JA</option>
        </select>
      </div>

      <div style="display: flex; gap: 8px;">
        <button class="btn-header-action" onclick="toggleTheme()">🌓</button>
        <button class="btn-header-action" onclick="openLoginModal()">⚙️ <span style="display:none; @media(min-width:400px){display:inline}">Painel Lojista</span></button>
      </div>
    </div>

    <img id="displayCapa" class="hero-banner" src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=80" alt="Capa" />

    <div class="establishment-info">
      <div class="logo-badge" id="displayLogoEmoji">🍽️</div>
      <h1 class="establishment-title" id="displayNome">Cardápio Virtual</h1>
      <p class="establishment-subtitle" id="displayDescricao">Praia do Futuro – Fortaleza/CE | Desde 1987</p>

      <div class="establishment-meta">
        <span class="meta-item">🕙 <span id="displayHorario">10:00 – 22:00</span></span>
        <span class="meta-item">📷 <span id="displayInstagram">@cardapiovirtual</span></span>
        <span class="meta-item">👀 <span id="displayViews">0</span> visualizações</span>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
     BARRA DE PESQUISA E FILTRO DE CATEGORIAS
     ========================================================================== -->
  <div class="sticky-controls">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Buscar no cardápio..." oninput="filterProducts()" />
    </div>

    <div class="categories-scroll" id="categoriesContainer">
      <!-- Categorias geradas dinamicamente -->
    </div>
  </div>

  <!-- ==========================================================================
     LISTAGEM DE PRODUTOS
     ========================================================================== -->
  <main class="menu-container" id="menuContainer">
    <!-- Produtos renderizados dinamicamente -->
  </main>

  <!-- ==========================================================================
     CARRINHO / BARRA INFERIOR FIXA
     ========================================================================== -->
  <div class="cart-bar">
    <div class="cart-summary">
      <div class="cart-badge-container">
        🛒
        <div class="cart-badge" id="cartCount">0</div>
      </div>
      <div>
        <div class="cart-total-text">Total da Comanda</div>
        <div class="cart-total-value" id="cartTotal">R$ 0,00</div>
      </div>
    </div>

    <button class="btn-view-cart" onclick="openCartModal()">Ver Comanda</button>
  </div>

  <!-- Botão Flutuante de Atalho ADM -->
  <button class="floating-gear" onclick="openLoginModal()" title="Painel Lojista">⚙️</button>

  <!-- ==========================================================================
     MODAL DO CARRINHO / COMANDA
     ========================================================================== -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-container">
      <div class="modal-header">
        <h2 class="modal-title">Sua Comanda</h2>
        <button class="btn-close" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cartItemsList">
        <!-- Itens do carrinho -->
      </div>

      <div style="margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border);">
        <div style="display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 16px;">
          <span>Total:</span>
          <span id="modalCartTotal">R$ 0,00</span>
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <button class="btn-primary" id="btnSendWhatsApp" onclick="sendWhatsAppOrder()">📲 Enviar Pedido via WhatsApp</button>
          <button class="btn-secondary" style="color: #DC2626;" onclick="clearCart()">🗑️ Limpar Carrinho</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ==========================================================================
     MODAL DE LOGIN (ADM)
     ========================================================================== -->
  <div class="modal-overlay" id="loginModal">
    <div class="modal-container" style="align-self: center; border-radius: var(--radius-lg);">
      <div class="modal-header">
        <h2 class="modal-title">Acesso Administrativo</h2>
        <button class="btn-close" onclick="closeLoginModal()">&times;</button>
      </div>

      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="loginEmail" required />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="loginPassword" required />
        </div>
        <button type="submit" class="btn-primary">Entrar no Painel</button>
      </form>
    </div>
  </div>

  <!-- ==========================================================================
     PAINEL ADMINISTRATIVO (ADM)
     ========================================================================== -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-container modal-fullscreen">
      <div class="modal-header">
        <h2 class="modal-title">Painel do Lojista</h2>
        <button class="btn-close" onclick="closeAdminModal()">&times;</button>
      </div>

      <div class="tabs-header">
        <button class="tab-btn active" onclick="switchTab('tabEst')">Estabelecimento</button>
        <button class="tab-btn" onclick="switchTab('tabProd')">Produtos</button>
        <button class="tab-btn" onclick="switchTab('tabImpExp')">Importar/Exportar</button>
      </div>

      <!-- ABA 1: ESTABELECIMENTO -->
      <div id="tabEst" class="tab-content">
        <form id="formEst" onsubmit="saveEstablishment(event)">
          <div class="form-group">
            <label>Nome do Estabelecimento</label>
            <input type="text" id="admNome" />
          </div>
          <div class="form-group">
            <label>Emoji da Logo</label>
            <input type="text" id="admLogoEmoji" placeholder="ex: 🍽️" />
          </div>
          <div class="form-group">
            <label>Descrição Curta</label>
            <input type="text" id="admDescricao" />
          </div>
          <div class="form-group">
            <label>WhatsApp (com DDD e sem caracteres especiais)</label>
            <input type="text" id="admWhatsApp" placeholder="5585999999999" />
          </div>
          <div class="form-group">
            <label>Instagram</label>
            <input type="text" id="admInstagram" placeholder="@seuinstagram" />
          </div>
          <div class="form-group">
            <label>Horário de Funcionamento</label>
            <input type="text" id="admHorario" />
          </div>
          <div class="form-group">
            <label>Modo de Vendas</label>
            <select id="admModoVendas">
              <option value="whatsapp">Receber Pedidos no WhatsApp</option>
              <option value="simulacao">Apenas Simulação de Conta (Visualização)</option>
            </select>
          </div>
          <div class="form-group">
            <label>URL Imagem de Capa</label>
            <input type="url" id="admUrlCapa" />
          </div>
          <div class="form-group">
            <label>Ou Upload Capa (Firebase Storage)</label>
            <input type="file" id="admFileCapa" accept="image/*" />
          </div>

          <button type="submit" class="btn-primary">Salvar Informações</button>
        </form>

        <div style="margin-top: 24px; padding: 12px; background: var(--bg-light); border-radius: var(--radius-sm); text-align: center;">
          <p style="font-size: 0.8rem; margin-bottom: 8px;">QR Code do Seu Cardápio:</p>
          <div id="qrcodeCanvas"></div>
        </div>
      </div>

      <!-- ABA 2: CATÁLOGO DE PRODUTOS -->
      <div id="tabProd" class="tab-content" style="display: none;">
        <div style="background: var(--bg-light); padding: 12px; border-radius: var(--radius-md); margin-bottom: 16px;">
          <h3 style="font-size: 0.95rem; margin-bottom: 12px;" id="formProdTitle">Cadastrar Novo Produto</h3>
          <form id="formProduct" onsubmit="handleSaveProduct(event)">
            <input type="hidden" id="prodId" />
            <div class="form-group">
              <label>Nome do Produto (PT)</label>
              <input type="text" id="prodNome" required />
            </div>
            <div class="form-group">
              <label>Categoria</label>
              <input type="text" id="prodCategoria" placeholder="ex: Bebidas, Sobremesas" required />
            </div>
            <div class="form-group">
              <label>Preço (R$)</label>
              <input type="number" step="0.01" id="prodPreco" required />
            </div>
            <div class="form-group">
              <label>Descrição Curta</label>
              <textarea id="prodDescricao" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>Legenda Alérgica (opcional)</label>
              <input type="text" id="prodAlergicos" placeholder="ex: Contém glúten, lactose" />
            </div>

            <div style="display: flex; gap: 8px; margin-top: 8px;">
              <button type="button" class="btn-secondary" onclick="triggerAITranslate()">🤖 Traduzir com IA</button>
              <button type="submit" class="btn-primary">Salvar Produto</button>
            </div>
          </form>
        </div>

        <div class="search-box">
          <input type="text" id="admSearchProd" placeholder="Buscar produtos no painel..." oninput="renderAdminProductList()" />
        </div>

        <div id="adminProductsList">
          <!-- Lista de produtos cadastrados -->
        </div>
      </div>

      <!-- ABA 3: IMPORTAR / EXPORTAR -->
      <div id="tabImpExp" class="tab-content" style="display: none;">
        <div class="form-group">
          <label>Exportar Backup (JSON)</label>
          <button class="btn-secondary" onclick="exportDataJSON()">📥 Baixar Dados em JSON</button>
        </div>
        <div class="form-group" style="margin-top: 20px;">
          <label>Importar Backup (JSON)</label>
          <input type="file" id="importJsonFile" accept=".json" />
          <button class="btn-primary" style="margin-top: 8px;" onclick="importDataJSON()">📤 Restaurar Backup</button>
        </div>
      </div>

      <!-- BOTÕES FIXOS ADM -->
      <div style="margin-top: 24px; display: flex; gap: 8px; border-top: 1px solid var(--border); padding-top: 12px;">
        <button class="btn-secondary" style="color: #DC2626;" onclick="handleLogout()">🔴 Sair do Painel</button>
      </div>
    </div>
  </div>

  <!-- QR Code Generator Lib -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <!-- ==========================================================================
     FIREBASE & LÓGICA DE NEGÓCIO (JAVASCRIPT)
     ========================================================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs, addDoc, deleteDoc, increment 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { 
      getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getStorage, ref, uploadBytes, getDownloadURL 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    // CONFIGURAÇÃO DO FIREBASE (cardvirt-b8b42)
    const firebaseConfig = {
      apiKey: "AIzaSyB9ZyY3zwX3NPbj56NWaTIZ9JhKf-hKhk0",
      authDomain: "cardvirt-b8b42.firebaseapp.com",
      projectId: "cardvirt-b8b42",
      storageBucket: "cardvirt-b8b42.firebasestorage.app",
      messagingSenderId: "168829829538",
      appId: "1:168829829538:web:1ffd3c3475d6f6324e72fb"
    };

    // Inicialização do Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);
    const storage = getStorage(app);

    // Estado da Aplicação
    let currentLanguage = 'PT';
    let currentCategory = 'Todos';
    let establishmentData = {};
    let productsList = [];
    let cart = JSON.parse(localStorage.getItem('virtual_cart') || '[]');

    /* ==========================================================================
       INICIALIZAÇÃO & REAL-TIME READS
       ========================================================================== */
    window.addEventListener('DOMContentLoaded', async () => {
      await loadEstablishment();
      await loadProducts();
      incrementViews();
      updateCartUI();
      generateQRCode();
    });

    // Registrar Visualização
    async function incrementViews() {
      try {
        const estRef = doc(db, "estabelecimento", "info");
        await updateDoc(estRef, { views: increment(1) });
      } catch (e) {
        // Se documento ainda não existir, ignora ou cria
      }
    }

    // Carregar Informações do Estabelecimento
    async function loadEstablishment() {
      try {
        const docRef = doc(db, "estabelecimento", "info");
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          establishmentData = docSnap.data();
        } else {
          // Dados Padrão Iniciais
          establishmentData = {
            nome: "Cardápio Virtual",
            logoEmoji: "🍽️",
            descricaoCurta: "Praia do Futuro – Fortaleza/CE | Desde 1987",
            whatsapp: "5585999999999",
            instagram: "@cardapiovirtual",
            horarioFuncionamento: "10:00 – 22:00",
            modoVendas: "whatsapp",
            urlCapa: "https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=80",
            views: 0
          };
        }
        renderEstablishmentUI();
      } catch (err) {
        console.error("Erro ao carregar estabelecimento:", err);
      }
    }

    function renderEstablishmentUI() {
      document.getElementById('displayNome').innerText = establishmentData.nome || 'Cardápio Virtual';
      document.getElementById('displayLogoEmoji').innerText = establishmentData.logoEmoji || '🍽️';
      document.getElementById('displayDescricao').innerText = establishmentData.descricaoCurta || '';
      document.getElementById('displayHorario').innerText = establishmentData.horarioFuncionamento || '';
      document.getElementById('displayInstagram').innerText = establishmentData.instagram || '';
      document.getElementById('displayCapa').src = establishmentData.urlCapa || '';
      document.getElementById('displayViews').innerText = establishmentData.views || 0;

      // Atualizar Formulários no Painel ADM
      document.getElementById('admNome').value = establishmentData.nome || '';
      document.getElementById('admLogoEmoji').value = establishmentData.logoEmoji || '';
      document.getElementById('admDescricao').value = establishmentData.descricaoCurta || '';
      document.getElementById('admWhatsApp').value = establishmentData.whatsapp || '';
      document.getElementById('admInstagram').value = establishmentData.instagram || '';
      document.getElementById('admHorario').value = establishmentData.horarioFuncionamento || '';
      document.getElementById('admModoVendas').value = establishmentData.modoVendas || 'whatsapp';
      document.getElementById('admUrlCapa').value = establishmentData.urlCapa || '';

      // Atualizar Visibilidade do Botão do WhatsApp
      const btnWA = document.getElementById('btnSendWhatsApp');
      if (establishmentData.modoVendas === 'simulacao') {
        btnWA.style.display = 'none';
      } else {
        btnWA.style.display = 'block';
      }
    }

    // Carregar Produtos
    async function loadProducts() {
      try {
        const querySnapshot = await getDocs(collection(db, "produtos"));
        productsList = [];
        querySnapshot.forEach((doc) => {
          productsList.push({ id: doc.id, ...doc.data() });
        });
        renderCategories();
        renderMenu();
        renderAdminProductList();
      } catch (err) {
        console.error("Erro ao carregar produtos:", err);
      }
    }

    /* ==========================================================================
       RENDERIZAÇÃO DO CARDÁPIO & FILTROS
       ========================================================================== */
    function renderCategories() {
      const categories = ['Todos', ...new Set(productsList.map(p => p.categoria))];
      const container = document.getElementById('categoriesContainer');

      container.innerHTML = categories.map(cat => `
        <button class="category-chip ${cat === currentCategory ? 'active' : ''}" 
                onclick="selectCategory('${cat}')">
          ${cat}
        </button>
      `).join('');
    }

    window.selectCategory = function(cat) {
      currentCategory = cat;
      renderCategories();
      renderMenu();
    };

    window.filterProducts = function() {
      renderMenu();
    };

    function renderMenu() {
      const container = document.getElementById('menuContainer');
      const searchTerm = document.getElementById('searchInput').value.toLowerCase();

      let filtered = productsList.filter(p => {
        const matchesCategory = currentCategory === 'Todos' || p.categoria === currentCategory;
        
        const nomeTrans = p[`nome${currentLanguage}`] || p.nomePT || '';
        const descTrans = p[`desc${currentLanguage}`] || p.descricao || '';
        
        const matchesSearch = nomeTrans.toLowerCase().includes(searchTerm) ||
                              descTrans.toLowerCase().includes(searchTerm) ||
                              (p.categoria && p.categoria.toLowerCase().includes(searchTerm));

        return matchesCategory && matchesSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted);">Nenhum produto encontrado.</div>`;
        return;
      }

      const grouped = {};
      filtered.forEach(p => {
        if (!grouped[p.categoria]) grouped[p.categoria] = [];
        grouped[p.categoria].push(p);
      });

      container.innerHTML = Object.keys(grouped).map(cat => `
        <div class="category-section">
          <div class="category-header">🍴 ${cat}</div>
          <div class="category-divider"></div>
          <div class="products-grid">
            ${grouped[cat].map(p => {
              const name = p[`nome${currentLanguage}`] || p.nomePT;
              const desc = p[`desc${currentLanguage}`] || p.descricao || '';
              const isAvailable = p.disponivel !== false;

              return `
                <div class="product-card ${!isAvailable ? 'unavailable' : ''}">
                  <div class="product-info">
                    <div>
                      <div class="product-name">${name}</div>
                      <div class="product-desc">${desc}</div>${p.alergicos ? `<div class="product-allergy">⚠️ ${p.alergicos}</div>` : ''}
                    </div>
                    <div class="product-footer">
                      <div class="product-price">R$ ${parseFloat(p.preco).toFixed(2).replace('.', ',')}</div>
                      <button class="btn-add-cart" 
                              ${!isAvailable ? 'disabled' : ''} 
                              onclick="addToCart('${p.id}')">
                        ${isAvailable ? '+ Adicionar' : 'Indisponível'}
                      </button>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `).join('');
    }

    /* ==========================================================================
       GESTÃO DO CARRINHO / COMANDA
       ========================================================================== */
    window.addToCart = function(productId) {
      const prod = productsList.find(p => p.id === productId);
      if (!prod) return;

      const existingIndex = cart.findIndex(item => item.id === productId);
      if (existingIndex > -1) {
        cart[existingIndex].qty += 1;
      } else {
        cart.push({ id: productId, qty: 1 });
      }

      saveCart();
    };

    function saveCart() {
      localStorage.setItem('virtual_cart', JSON.stringify(cart));
      updateCartUI();
    }

    function updateCartUI() {
      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      let totalPrice = 0;

      cart.forEach(item => {
        const prod = productsList.find(p => p.id === item.id);
        if (prod) totalPrice += prod.preco * item.qty;
      });

      document.getElementById('cartCount').innerText = totalQty;
      document.getElementById('cartTotal').innerText = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;
      document.getElementById('modalCartTotal').innerText = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

      renderCartItems();
    }

    function renderCartItems() {
      const container = document.getElementById('cartItemsList');
      if (cart.length === 0) {
        container.innerHTML = `<p style="text-align:center; padding:20px; color:var(--text-muted)">Sua comanda está vazia.</p>`;
        return;
      }

      container.innerHTML = cart.map(item => {
        const prod = productsList.find(p => p.id === item.id) || {};
        const name = prod[`nome${currentLanguage}`] || prod.nomePT || 'Item';

        return `
          <div class="cart-item">
            <div>
              <div style="font-weight:600; font-size:0.9rem;">${name}</div>
              <div style="font-size:0.8rem; color:var(--text-muted)">R$ ${(prod.preco || 0).toFixed(2).replace('.', ',')}</div>
            </div>
            <div class="qty-controls">
              <button class="btn-qty" onclick="changeQty('${item.id}', -1)">-</button>
              <span style="font-weight:600; font-size:0.9rem;">${item.qty}</span>
              <button class="btn-qty" onclick="changeQty('${item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.changeQty = function(id, delta) {
      const index = cart.findIndex(item => item.id === id);
      if (index > -1) {
        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
      }
      saveCart();
    };

    window.clearCart = function() {
      if (confirm("Deseja realmente limpar sua comanda?")) {
        cart = [];
        saveCart();
        closeCartModal();
      }
    };

    window.sendWhatsAppOrder = function() {
      if (cart.length === 0) return alert("Sua comanda está vazia.");

      let message = `*Pedido - ${establishmentData.nome}*\n\n`;
      let total = 0;

      cart.forEach(item => {
        const prod = productsList.find(p => p.id === item.id);
        if (prod) {
          const subtotal = prod.preco * item.qty;
          total += subtotal;
          message += `• ${item.qty}x ${prod.nomePT} - R$ ${subtotal.toFixed(2).replace('.', ',')}\n`;
        }
      });

      message += `\n*Total: R$ ${total.toFixed(2).replace('.', ',')}*`;

      const phone = establishmentData.whatsapp.replace(/\D/g, '');
      const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
      window.open(url, '_blank');
    };

    /* ==========================================================================
       IDIOMA E MODO ESCURO
       ========================================================================== */
    window.changeLanguage = function(lang) {
      currentLanguage = lang;
      renderMenu();
    };

    window.toggleTheme = function() {
      const currentTheme = document.body.getAttribute('data-theme');
      if (currentTheme === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    };

    /* ==========================================================================
       PAINEL ADM & AUTENTICAÇÃO
       ========================================================================== */
    window.openLoginModal = function() {
      if (auth.currentUser) {
        openAdminModal();
      } else {
        document.getElementById('loginModal').classList.add('active');
      }
    };

    window.closeLoginModal = function() {
      document.getElementById('loginModal').classList.remove('active');
    };

    window.handleLogin = async function(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;

      try {
        await signInWithEmailAndPassword(auth, email, pass);
        closeLoginModal();
        openAdminModal();
      } catch (err) {
        alert("Falha ao realizar login: " + err.message);
      }
    };

    window.handleLogout = async function() {
      await signOut(auth);
      closeAdminModal();
      alert("Sessão encerrada.");
    };

    window.openAdminModal = function() {
      document.getElementById('adminModal').classList.add('active');
    };

    window.closeAdminModal = function() {
      document.getElementById('adminModal').classList.remove('active');
    };

    window.switchTab = function(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).style.display = 'block';
      event.target.classList.add('active');
    };

    /* ==========================================================================
       CRUD ESTABELECIMENTO
       ========================================================================== */
    window.saveEstablishment = async function(e) {
      e.preventDefault();
      
      let capaUrl = document.getElementById('admUrlCapa').value;
      const fileInput = document.getElementById('admFileCapa');

      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const storageRef = ref(storage, `capa/${Date.now()}_${file.name}`);
        await uploadBytes(storageRef, file);
        capaUrl = await getDownloadURL(storageRef);
      }

      const updated = {
        nome: document.getElementById('admNome').value,
        logoEmoji: document.getElementById('admLogoEmoji').value,
        descricaoCurta: document.getElementById('admDescricao').value,
        whatsapp: document.getElementById('admWhatsApp').value,
        instagram: document.getElementById('admInstagram').value,
        horarioFuncionamento: document.getElementById('admHorario').value,
        modoVendas: document.getElementById('admModoVendas').value,
        urlCapa: capaUrl,
        views: establishmentData.views || 0
      };

      await setDoc(doc(db, "estabelecimento", "info"), updated);
      establishmentData = updated;
      renderEstablishmentUI();
      alert("Informações do estabelecimento salvas com sucesso!");
    };

    /* ==========================================================================
       CRUD PRODUTOS & TRADUÇÃO COM IA
       ========================================================================== */
    window.handleSaveProduct = async function(e) {
      e.preventDefault();

      const id = document.getElementById('prodId').value;
      const productData = {
        nomePT: document.getElementById('prodNome').value,
        categoria: document.getElementById('prodCategoria').value,
        preco: parseFloat(document.getElementById('prodPreco').value),
        descricao: document.getElementById('prodDescricao').value,
        alergicos: document.getElementById('prodAlergicos').value,
        disponivel: true
      };

      if (id) {
        await updateDoc(doc(db, "produtos", id), productData);
      } else {
        const translations = await translateWithIA(productData.nomePT, productData.descricao);
        await addDoc(collection(db, "produtos"), { ...productData, ...translations });
      }

      document.getElementById('formProduct').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('formProdTitle').innerText = "Cadastrar Novo Produto";
      
      await loadProducts();
      alert("Produto salvo com sucesso!");
    };

    window.renderAdminProductList = function() {
      const container = document.getElementById('adminProductsList');
      const search = document.getElementById('admSearchProd').value.toLowerCase();

      const filtered = productsList.filter(p => p.nomePT.toLowerCase().includes(search));

      container.innerHTML = filtered.map(p => `
        <div style="display:flex; justify-content:space-between; align-items:center; padding:10px; border-bottom:1px solid var(--border);">
          <div>
            <div style="font-weight:600;">${p.nomePT}</div>
            <div style="font-size:0.8rem; color:var(--text-muted)">R$ ${p.preco.toFixed(2)} | ${p.categoria}</div>
          </div>
          <div style="display:flex; gap:6px;">
            <button style="padding:4px 8px; border:none; border-radius:4px; background:${p.disponivel !== false ? '#10B981' : '#EF4444'}; color:#FFF;" 
                    onclick="toggleProductAvailability('${p.id}', ${p.disponivel !== false})">
              ${p.disponivel !== false ? 'Disponível' : 'Indisponível'}
            </button>
            <button style="padding:4px 8px; border:none; border-radius:4px; background:#3B82F6; color:#FFF;" onclick="editProduct('${p.id}')">✏️</button>
            <button style="padding:4px 8px; border:none; border-radius:4px; background:#EF4444; color:#FFF;" onclick="deleteProduct('${p.id}')">🗑️</button>
          </div>
        </div>
      `).join('');
    };

    window.toggleProductAvailability = async function(id, currentStatus) {
      await updateDoc(doc(db, "produtos", id), { disponivel: !currentStatus });
      await loadProducts();
    };

    window.editProduct = function(id) {
      const prod = productsList.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('prodId').value = prod.id;
      document.getElementById('prodNome').value = prod.nomePT;
      document.getElementById('prodCategoria').value = prod.categoria;
      document.getElementById('prodPreco').value = prod.preco;
      document.getElementById('prodDescricao').value = prod.descricao || '';
      document.getElementById('prodAlergicos').value = prod.alergicos || '';

      document.getElementById('formProdTitle').innerText = "Editar Produto";
    };

    window.deleteProduct = async function(id) {
      if (confirm("Tem certeza que deseja excluir este produto?")) {
        await deleteDoc(doc(db, "produtos", id));
        await loadProducts();
      }
    };

    /* MOCK DE INTEGRAÇÃO COM IA PARA TRADUÇÕES MULTI-IDIOMA */
    async function translateWithIA(nome, descricao) {
      const languages = ['EN', 'ZH', 'FR', 'IT', 'DE', 'KO', 'ES', 'JA'];
      const result = {};

      languages.forEach(lang => {
        result[`nome${lang}`] = `[${lang}] ${nome}`;
        result[`desc${lang}`] = `[${lang}] ${descricao}`;
      });

      return result;
    }

    window.triggerAITranslate = async function() {
      const nome = document.getElementById('prodNome').value;
      const desc = document.getElementById('prodDescricao').value;

      if (!nome) return alert("Preencha o nome do produto antes de traduzir.");

      await translateWithIA(nome, desc);
      alert("Traduções geradas pela IA com sucesso!");
    };

    /* ==========================================================================
       IMPORTAR / EXPORTAR E QR CODE
       ========================================================================== */
    window.exportDataJSON = function() {
      const data = { establishment: establishmentData, products: productsList };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_cardapio_${Date.now()}.json`;
      a.click();
    };

    window.importDataJSON = function() {
      const fileInput = document.getElementById('importJsonFile');
      if (!fileInput.files.length) return alert("Selecione um arquivo JSON.");

      const reader = new FileReader();
      reader.onload = async function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.establishment) {
            await setDoc(doc(db, "estabelecimento", "info"), imported.establishment);
          }
          if (imported.products && Array.isArray(imported.products)) {
            for (const prod of imported.products) {
              const { id, ...data } = prod;
              await addDoc(collection(db, "produtos"), data);
            }
          }
          alert("Backup restaurado com sucesso!");
          location.reload();
        } catch (err) {
          alert("Erro ao importar JSON: " + err.message);
        }
      };
      reader.readAsText(fileInput.files[0]);
    };

    function generateQRCode() {
      const qrContainer = document.getElementById("qrcodeCanvas");
      qrContainer.innerHTML = "";
      new QRCode(qrContainer, {
        text: window.location.href,
        width: 128,
        height: 128
      });
    }

    // Controles Globais dos Modais
    window.openCartModal = () => document.getElementById('cartModal').classList.add('active');
    window.closeCartModal = () => document.getElementById('cartModal').classList.remove('active');
  </script>
</body>
</html>
